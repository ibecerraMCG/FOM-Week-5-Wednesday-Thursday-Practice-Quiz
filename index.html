<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 5 Wednesday & Thursday Practice Quiz</title>
    <style>
        /* --- Color Variables --- */
        :root {
            /* Default: Dark Theme */
            --bg-color: #2d343e; /* Dark background */
            --container-bg: #3c424f; /* Slightly lighter container */
            --text-color: #e8e6e3; /* Light text */
            --question-text-color: #8ab4f8; /* Light blue for questions */
            --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
            --border-color: #555; /* Darker borders */
            --separator-color: #4a4f5a;
            --label-bg: #454c5a;
            --label-border: #6c757d;
            --label-hover-bg: #525966;
            --label-hover-border: #7a828a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover-bg: #a3c5f9;
            --button-disabled-bg: #5f6368;
            --feedback-correct-bg: #344e41;
            --feedback-correct-text: #c7f9cc;
            --feedback-correct-border: #52b788;
            --feedback-incorrect-bg: #5e2129;
            --feedback-incorrect-text: #f8d7da;
            --feedback-incorrect-border: #a4133c;
            --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
            --feedback-source-text: #c7d3e0;
            --feedback-separator: #6c757d;
            --radio-accent: #8ab4f8;
        }

        .light-theme {
            --bg-color: #eef2f7;
            --container-bg: #ffffff;
            --text-color: #343a40;
            --question-text-color: #0056b3;
            --lo-text-color: #5a6e8a;
            --border-color: #dee2e6;
            --separator-color: #e9ecef;
            --label-bg: #f8f9fa;
            --label-border: #ced4da;
            --label-hover-bg: #e2e6ea;
            --label-hover-border: #adb5bd;
            --button-bg: #007bff;
            --button-text: white;
            --button-hover-bg: #0056b3;
            --button-disabled-bg: #6c757d;
            --feedback-correct-bg: #d1e7dd;
            --feedback-correct-text: #0f5132;
            --feedback-correct-border: #badbcc;
            --feedback-incorrect-bg: #f8d7da;
            --feedback-incorrect-text: #842029;
            --feedback-incorrect-border: #f5c2c7;
            --feedback-rationale-text: #495057;
            --feedback-source-text: #343a40;
            --feedback-separator: #ccc;
            --radio-accent: #007bff;
        }

        /* --- General Styles --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 40px;
            transition: background-color 0.3s, color 0.3s;
        }

        #theme-toggle-button {
            position: fixed;
            top: 15px;
            right: 15px;
            padding: 8px 12px;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--label-border);
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            z-index: 1000;
             transition: background-color 0.3s, color 0.3s;
        }
         #theme-toggle-button:hover {
             opacity: 0.8;
         }


        #quiz-container {
            max-width: 900px;
            margin: 80px auto 30px auto;
            background: var(--container-bg);
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .question-block {
            margin-bottom: 35px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--separator-color);
            transition: border-color 0.3s;
        }

        .question-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 5px;
        }
        
        .learning-objective {
            font-size: 0.85em;
            font-style: italic;
            color: var(--lo-text-color);
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--separator-color);
        }

        .question-text {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 18px;
            color: var(--question-text-color);
            transition: color 0.3s;
        }

        .options label {
            display: block;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid var(--label-border);
            background-color: var(--label-bg);
            transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }

        .options label:hover {
            background-color: var(--label-hover-bg);
            border-color: var(--label-hover-border);
        }

        .options input[type="radio"]:checked+span {
             font-weight: bold;
             color: var(--question-text-color);
        }
        .options input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--radio-accent);
        }

        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .check-button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s, color 0.2s, opacity 0.2s;
            background-color: var(--button-bg);
            color: var(--button-text);
        }

        .check-button:hover {
            opacity: 0.85;
        }

         .check-button:disabled {
             background-color: var(--button-disabled-bg);
             cursor: not-allowed;
             opacity: 0.7;
         }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            font-size: 0.95em;
            display: none;
            border: 1px solid transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .feedback.correct {
            background-color: var(--feedback-correct-bg);
            color: var(--feedback-correct-text);
            border-color: var(--feedback-correct-border);
            display: block;
        }

        .feedback.incorrect {
            background-color: var(--feedback-incorrect-bg);
            color: var(--feedback-incorrect-text);
            border-color: var(--feedback-incorrect-border);
            display: block;
        }

        .feedback-status {
             font-weight: bold;
             font-size: 1.1em;
             display: block;
             margin-bottom: 8px;
        }

        .feedback-rationale {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--feedback-separator);
            font-size: 0.9em;
            color: var(--feedback-rationale-text);
            transition: color 0.3s, border-color 0.3s;
        }
        
        .feedback-source {
            margin-top: 10px;
            font-size: 0.85em;
            font-style: italic;
            color: var(--feedback-source-text);
            background-color: rgba(0,0,0,0.1);
            padding: 8px;
            border-radius: 4px;
        }

        h1 {
            text-align: center;
            color: var(--question-text-color);
            margin-top: 30px;
            margin-bottom: 30px;
            font-weight: 600;
            transition: color 0.3s;
        }

    </style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 5 Wednesday & Thursday Practice Quiz</h1>

    <div id="quiz-container">

    <script>
        const quizData = [
            // Foundations of Cancer Treatment Questions
            {
                learningObjective: "LO1 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for surgery in the treatment of cancer.",
                question: "A 35-year-old woman with a known pathogenic BRCA1 mutation and a strong family history of breast and ovarian cancer elects to undergo a bilateral mastectomy and oophorectomy, despite having no evidence of cancer herself. This type of surgical intervention is best classified as:",
                options: { A: "Palliative", B: "Diagnostic", C: "Definitive/curative", D: "Prophylactic" },
                correctAnswer: "D",
                rationale: "Prophylactic surgery involves the removal of an organ or tissue that is at high risk of developing cancer in the future, with the goal of preventing the cancer from ever occurring. This is a common strategy for individuals with high-risk genetic mutations like BRCA1/2.",
                source: "'Prophylactic surgery - Some underlying conditions or congenital or genetic traits are associated with a significantly higher incidence of cancer... prophylactic bilateral or contralateral mastectomy and oophorectomy for individuals with breast cancer who carry a BRCA1 or 2 gene mutation.' (Foundations of Cancer Treatment, Page 2)"
            },
            {
                learningObjective: "LO1 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for surgery in the treatment of cancer.",
                question: "A surgeon performs an excisional biopsy of a suspicious skin lesion. Which of the following best describes this procedure?",
                options: { A: "Removal of a small wedge of tissue from a larger mass", B: "Use of a fine needle to aspirate cells for cytology", C: "Excision of the entire suspected tumor tissue", D: "Partial resection of a bulky tumor to improve the efficacy of other treatments" },
                correctAnswer: "C",
                rationale: "An excisional biopsy is a diagnostic procedure where the entire lesion is removed, often with a small margin of normal tissue. This is in contrast to an incisional biopsy, where only a piece of the tumor is taken.",
                source: "'Excisional biopsy: involves excision of the entire suspected tumor tissue with little or no margin of surrounding normal tissue.' (Foundations of Cancer Treatment, Page 2)"
            },
            {
                learningObjective: "LO1 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for surgery in the treatment of cancer.",
                question: "Curative surgery is most likely to be successful for tumors with which of the following sets of characteristics?",
                options: { A: "Fast-growing, high growth fraction, high metastatic potential", B: "Slow-growing, low growth fraction, low metastatic potential", C: "Disseminated hematologic malignancies", D: "Poorly differentiated, widely invasive tumors" },
                correctAnswer: "B",
                rationale: "Surgery is a local therapy and is most effective for tumors that are localized and have not spread. Therefore, tumors that are slow-growing, have a low proportion of dividing cells (low growth fraction), and have a low potential to metastasize are the most amenable to being cured by surgical resection alone.",
                source: "'Slow-growing tumors with a long cell cycle, low growth fraction (= cells actively dividing/total number of cells), and low metastatic potential are the most amenable to curative surgical treatment.' (Foundations of Cancer Treatment, Page 2)"
            },
            {
                learningObjective: "LO2 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for radiotherapy in the treatment of cancer and the biological effect of radiation on cancer cells.",
                question: "The primary biological effect of ionizing radiation that leads to cancer cell death is damage to which of the following macromolecules?",
                options: { A: "Ribosomes", B: "Mitochondrial membranes", C: "Chromosomal DNA", D: "Cytoskeletal proteins" },
                correctAnswer: "C",
                rationale: "While radiation can damage many cellular components, its most critical and lethal effect is damage to chromosomal DNA. Double-strand breaks (DSBs) are considered the most lethal form of DNA damage induced by radiation, leading to chromosomal instability, mutation, and apoptosis.",
                source: "'The biological effects of radiation are complex and mainly derived from damage to chromosomal DNA. Ionizing radiation may also directly affect DNA structure by inducing DNA breaks, particularly, DSBs (considered as the most lethal damage to DNA).' (Foundations of Cancer Treatment, Page 3)"
            },
            {
                learningObjective: "LO2 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for radiotherapy in the treatment of cancer and the biological effect of radiation on cancer cells.",
                question: "Ionizing radiation can damage cells through two main mechanisms: a direct effect and an indirect effect. The indirect effect, which accounts for the majority of radiation-induced damage, is mediated by:",
                options: { A: "Direct ionization of the DNA molecule", B: "Generation of free radicals and reactive oxygen species (ROS)", C: "Inhibition of cellular ATP production", D: "Activation of pro-apoptotic cell surface receptors" },
                correctAnswer: "B",
                rationale: "The indirect effect of radiation occurs when the radiation ionizes water molecules within the cell, creating highly reactive free radicals and reactive oxygen species (ROS) like the hydroxyl radical. These ROS then diffuse and cause damage to critical cellular components, primarily DNA.",
                source: "'Ionizing radiation generates free radicals and reactive oxygen species (ROS) in the cell. The ROS can cause significant secondary effects and oxidative damage to all of the polymeric molecules such as nucleic acids...' (Foundations of Cancer Treatment, Page 3)"
            },
            {
                learningObjective: "LO2 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for radiotherapy in the treatment of cancer and the biological effect of radiation on cancer cells.",
                question: "Which of the following cell populations would be considered the most radiosensitive?",
                options: { A: "Neurons in the central nervous system", B: "Quiescent muscle cells", C: "Cells in the bone marrow", D: "Mature chondrocytes in cartilage" },
                correctAnswer: "C",
                rationale: "Radiosensitivity is directly related to the proliferative rate of a cell population. Cells that are dividing rapidly, such as hematopoietic stem cells in the bone marrow and epithelial cells of the GI tract, are highly radiosensitive. Quiescent or slowly dividing cells, like neurons, are much more radioresistant.",
                source: "'Quiescent and slowly dividing cells are less radiosensitive (like those constituting the nervous system), while cells with high proliferation rates are more radiosensitive (like bone marrow, skin, and epithelial cells of the gastro-intestinal tract, among others).' (Foundations of Cancer Treatment, Page 4)"
            },
            {
                learningObjective: "LO3 (Foundations of Cancer Treatment): Discuss briefly the commonly used treatment modalities in radiotherapy, the rationale for fractionation of the radiation dose, and common side effects of radiotherapy.",
                question: "A patient with early-stage breast cancer receives a course of external beam radiation therapy (EBRT) consisting of 50 Gray delivered in 25 daily treatments over 5 weeks. This practice of dividing the total radiation dose into multiple smaller doses is known as:",
                options: { A: "Brachytherapy", B: "Systemic radiation therapy", C: "Fractionation", D: "Stereotactic radiosurgery (SRS)" },
                correctAnswer: "C",
                rationale: "Fractionation is the process of dividing a total radiation dose into a series of smaller, daily doses. This is a fundamental principle of radiotherapy that aims to maximize tumor cell killing while minimizing damage to surrounding normal tissues.",
                source: "'Fractionated radiotherapy... the total dose of radiation prescribed to treat a particular tumor in EBRT is divided into a number of daily doses or fractions - fractionation.' (Foundations of Cancer Treatment, Page 5)"
            },
            {
                learningObjective: "LO3 (Foundations of Cancer Treatment): Discuss briefly the commonly used treatment modalities in radiotherapy, the rationale for fractionation of the radiation dose, and common side effects of radiotherapy.",
                question: "What is the primary radiobiological rationale for using a fractionated radiation schedule?",
                options: { A: "To allow cancer cells time to become more resistant between doses", B: "To deliver the entire radiation dose in a single, convenient session", C: "To allow normal, healthy cells time to repair sublethal DNA damage between treatments", D: "To synchronize all tumor cells into the most radioresistant phase of the cell cycle" },
                correctAnswer: "C",
                rationale: "The main advantage of fractionation is that it exploits the difference in repair capacity between normal cells and cancer cells. The interval between fractions allows normal tissues to repair sublethal radiation damage more efficiently than tumor cells, which often have defective DNA repair pathways. This widens the therapeutic window.",
                source: "'Repair- Repair is one of the primary reasons for fractionated radiotherapy. By fractionating the radiation dose into smaller parts normal cells are allowed time to repair sublethal damage.' (Foundations of Cancer Treatment, Page 5)"
            },
            {
                learningObjective: "LO3 (Foundations of Cancer Treatment): Discuss briefly the commonly used treatment modalities in radiotherapy, the rationale for fractionation of the radiation dose, and common side effects of radiotherapy.",
                question: "A patient undergoing radiation therapy to the pelvis for prostate cancer develops diarrhea and urinary frequency. These side effects are occurring during the treatment course. How would these toxicities be classified?",
                options: { A: "Acute toxicities", B: "Late toxicities", C: "Systemic toxicities", D: "Anaphylactic reactions" },
                correctAnswer: "A",
                rationale: "Acute toxicities are adverse effects that occur during or shortly after the course of radiation therapy, typically within two months of completion. They are usually caused by damage to rapidly dividing tissues like the intestinal and bladder mucosa. Late toxicities appear months to years after treatment.",
                source: "'Common toxicities include diarrhea, nausea and vomiting, mucositis, xerostomia... Most acute toxicities resolve within the two months after the completion of radiation therapy...' (Foundations of Cancer Treatment, Page 7)"
            },
            {
                learningObjective: "LO4 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for chemotherapy in the treatment of cancer.",
                question: "A patient with early-stage breast cancer undergoes a lumpectomy. Following surgery, she is treated with chemotherapy to eliminate any microscopic cancer cells that may remain in the body. This use of chemotherapy after the primary treatment is known as:",
                options: { A: "Neoadjuvant therapy", B: "Palliative therapy", C: "Adjuvant therapy", D: "Induction therapy" },
                correctAnswer: "C",
                rationale: "Adjuvant therapy is treatment given after the primary treatment (like surgery) to target and destroy any residual microscopic disease, with the goal of reducing the risk of recurrence and curing the patient.",
                source: "'After other treatments, to kill hidden cancer cells: Chemotherapy can be used after other treatments, such as surgery, to kill any cancer cells that might remain in the body. Doctors call this adjuvant therapy.' (Foundations of Cancer Treatment, Page 7)"
            },
            {
                learningObjective: "LO4 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for chemotherapy in the treatment of cancer.",
                question: "A patient is diagnosed with a large, locally advanced rectal cancer that is initially considered unresectable. The patient receives chemotherapy and radiation before surgery to shrink the tumor and improve the chances of a successful resection. This use of therapy before the primary treatment is known as:",
                options: { A: "Adjuvant therapy", B: "Neoadjuvant therapy", C: "Salvage therapy", D: "Consolidation therapy" },
                correctAnswer: "B",
                rationale: "Neoadjuvant therapy is treatment given before the main treatment. Its purpose is often to shrink a tumor to make surgery easier or more effective, or to allow for a less extensive surgical procedure (e.g., lumpectomy instead of mastectomy).",
                source: "'To prepare a patient for other treatments: Chemotherapy can be used to shrink a tumor so that other treatments, such as radiation and surgery, are possible. Doctors call this neoadjuvant therapy.' (Foundations of Cancer Treatment, Page 7)"
            },
            {
                learningObjective: "LO4 (Foundations of Cancer Treatment): Describe broadly the rationales and indications for chemotherapy in the treatment of cancer.",
                question: "A patient with widely metastatic pancreatic cancer that is not considered curable is given chemotherapy. The primary goal of this treatment is to relieve symptoms, improve quality of life, and potentially prolong survival. This intent of therapy is best described as:",
                options: { A: "Curative", B: "Prophylactic", C: "Adjuvant", D: "Palliative" },
                correctAnswer: "D",
                rationale: "Palliative chemotherapy is used in the setting of advanced, incurable disease. The focus is not on curing the cancer, but on managing symptoms, improving the patient's quality of life, and potentially extending their lifespan.",
                source: "'To ease signs and symptoms: Chemotherapy may help relieve signs and symptoms of cancer by killing some of the cancer cells. Doctors call this palliative chemotherapy.' (Foundations of Cancer Treatment, Page 7)"
            },
            {
                learningObjective: "LO5 (Foundations of Cancer Treatment): Explain the rationale underlying the pulsed intermittent chemotherapy and the classification of the chemotherapeutic drugs. Describe common side effects of chemotherapy.",
                question: "The log-kill principle in chemotherapy states that a given dose of a cytotoxic drug kills a:",
                options: { A: "Constant number of cancer cells, regardless of tumor size.", B: "Constant fraction of cancer cells, regardless of tumor size.", C: "Larger fraction of cells in a large tumor than in a small tumor.", D: "All cancer cells in a single dose if the tumor is small enough." },
                correctAnswer: "B",
                rationale: "The log-kill hypothesis is a cornerstone of chemotherapy. It posits that a specific dose of a drug kills a constant fraction (or percentage) of the tumor cell population, not a constant number. This is why multiple cycles of therapy are required to reduce the tumor burden to a level where the immune system can eliminate the remaining cells.",

            {
                learningObjective: "LO5 (Foundations of Cancer Treatment): Explain the rationale underlying the pulsed intermittent chemotherapy and the classification of the chemotherapeutic drugs. Describe common side effects of chemotherapy.",

                correctAnswer: "B",
                rationale: "Chemotherapy damages both cancer cells and normal, rapidly dividing cells. The rest periods between cycles are crucial to allow normal tissues, especially the bone marrow and gastrointestinal lining, to repopulate and recover, thereby minimizing dose-limiting toxicities.",

            {

                options: { A: "Anemia", B: "Thrombocytopenia", C: "Tumor lysis syndrome", D: "Neutropenic sepsis" },
                correctAnswer: "D",
                rationale: "Neutropenia is a reduction in neutrophils, a type of white blood cell critical for fighting bacterial infections. When a patient with severe neutropenia develops a fever, it is considered a medical emergency known as neutropenic sepsis (or febrile neutropenia), as they are at high risk for a rapidly fatal infection.",
                source: "'Patients who have low levels of neutrophils have an increased susceptibility to infections. This can lead to a condition called neutropenic sepsis which is a potentially life-threatening emergency.' (Foundations of Cancer Treatment, Page 11)"
            },
            {
                learningObjective: "LO6 (Foundations of Cancer Treatment): Briefly discuss the newer types of cancer treatment options, viz., targeted therapy, hormone therapy and immunotherapy.",
                question: "A patient with chronic myelogenous leukemia (CML) is treated with imatinib. This drug specifically inhibits the BCR-ABL tyrosine kinase, the molecular driver of CML, without affecting most normal cells. Imatinib is a prime example of which class of cancer therapy?",
                options: { A: "Cytotoxic chemotherapy", B: "Hormone therapy", C: "Targeted therapy", D: "Immunotherapy" },
                correctAnswer: "C",
                rationale: "Targeted therapies are designed to interfere with specific molecular targets (like the BCR-ABL kinase) that are involved in the growth and progression of cancer. They are distinct from standard chemotherapy, which acts more broadly on all rapidly dividing cells.",
                source: "'Targeted therapies act on specific molecular targets that are associated with cancer, whereas most standard chemotherapies act on all rapidly dividing normal and cancerous cells.' (Foundations of Cancer Treatment, Page 12)"
            },
            {
                learningObjective: "LO6 (Foundations of Cancer Treatment): Briefly discuss the newer types of cancer treatment options, viz., targeted therapy, hormone therapy and immunotherapy.",
                question: "A patient with metastatic melanoma is treated with pembrolizumab, a drug that blocks the PD-1 protein on T-cells. By blocking this interaction, the drug allows the patient's own T-cells to recognize and attack the tumor. This treatment modality is best classified as:",
                options: { A: "Hormone therapy", B: "Targeted therapy", C: "Immunotherapy", D: "Cytotoxic chemotherapy" },
                correctAnswer: "C",
                rationale: "Pembrolizumab is an immune checkpoint inhibitor. This class of drugs works by boosting or altering the body's own immune system to fight cancer. By blocking 'off-switches' like PD-1, these drugs unleash the T-cells to attack the tumor.",
                source: "'Immune checkpoint inhibitors, which are drugs that block immune checkpoints. By blocking them, these drugs allow immune cells to respond more strongly to cancer.' (Foundations of Cancer Treatment, Page 13)"
            },
            {
                learningObjective: "LO6 (Foundations of Cancer Treatment): Briefly discuss the newer types of cancer treatment options, viz., targeted therapy, hormone therapy and immunotherapy.",
                question: "A patient with ER-positive (estrogen receptor-positive) breast cancer is prescribed tamoxifen. This drug works by blocking the estrogen receptor, preventing estrogen from stimulating the cancer cells to grow. This approach is an example of:",
                options: { A: "Immunotherapy", B: "Targeted therapy", C: "Cytotoxic chemotherapy", D: "Hormone therapy" },
                correctAnswer: "D",
                rationale: "Hormone therapy (or endocrine therapy) is used for cancers that are driven by hormones, like certain breast and prostate cancers. These drugs work by either blocking the hormone's action at its receptor (like tamoxifen) or by preventing the body from producing the hormone.",
                source: "'Hormone therapy... These drugs are used to slow the growth of certain cancers in hormone-responsive tissues such as breast... They work by making the cancer cells unable to use the hormone they need to grow...' (Foundations of Cancer Treatment, Page 12)"
            },

                learningObjective: "LO1 (Survival Mechanisms): Understand cancer survival mechanisms (hallmarks of cancer), emphasizing cancer cells uncontrollable growth, resistance to cell death, and altered metabolism.",
                question: "Many cancer cells exhibit the 'Warburg effect,' a metabolic shift towards aerobic glycolysis even when sufficient oxygen is available for oxidative phosphorylation. Although this process generates far less ATP per molecule of glucose, what is the primary advantage it provides to rapidly proliferating tumor cells?",

                correctAnswer: "C",
                rationale: "The Warburg effect is not primarily about maximizing ATP production. Instead, by shunting glucose through glycolysis, cancer cells can generate the carbon-based building blocks (e.g., intermediates for amino acid and nucleotide synthesis) that are essential for building new cells during rapid proliferation.",
                source: "'Glycolysis intermediates are used for nucleic acid, fatty acid & SAM synthesis.' (Cancer Survival Mechanisms, Slide 17)"
            },
            {
                learningObjective: "LO1 (Survival Mechanisms): Understand cancer survival mechanisms (hallmarks of cancer), emphasizing cancer cells uncontrollable growth, resistance to cell death, and altered metabolism.",
                question: "A key hallmark of cancer is the ability to resist programmed cell death, or apoptosis. Cancer cells often achieve this by upregulating anti-apoptotic proteins. Which of the following is a major anti-apoptotic protein that, when overexpressed, can make cancer cells resistant to chemotherapy?",

                correctAnswer: "C",

                source: "'Cancer cells resist apoptosis by upregulating bcl-2, bcl-XL... which inhibits caspase activity.' (Cancer Survival Mechanisms, Slide 11)"
            },
            {
                learningObjective: "LO1 (Survival Mechanisms): Understand cancer survival mechanisms (hallmarks of cancer), emphasizing cancer cells uncontrollable growth, resistance to cell death, and altered metabolism.",
                question: "Inactivation of the tumor suppressor protein p53 is one of the most common events in human cancer. A major reason this contributes to cancer progression is that p53 normally acts as a master regulator that can induce which two critical cellular responses to DNA damage?",

        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Element Selection ---
            const quizContainer = document.getElementById('quiz-container');
            const themeToggleButton = document.getElementById('theme-toggle-button');
            const bodyElement = document.body;

            // --- Theme Functions ---
            function applyTheme(theme) {
                if (theme === 'light') {
                    bodyElement.classList.add('light-theme');
                    themeToggleButton.textContent = 'Switch to Dark Mode';
                } else {
                    bodyElement.classList.remove('light-theme');
                    themeToggleButton.textContent = 'Switch to Light Mode';
                }
                localStorage.setItem('quizTheme', theme);
            }

            themeToggleButton.addEventListener('click', () => {
                if (bodyElement.classList.contains('light-theme')) {
                    applyTheme('dark');
                } else {
                    applyTheme('light');
                }
            });

            // --- Quiz Logic ---
            function loadQuiz() {
                if (!quizContainer) {
                    console.error("Quiz container not found!");
                    return;
                }
                quizData.forEach((qData, index) => {
                    const questionBlock = document.createElement('div');
                    questionBlock.classList.add('question-block');
                    questionBlock.id = `q${index}`;

                    const loText = document.createElement('div');
                    loText.classList.add('learning-objective');
                    loText.textContent = qData.learningObjective;
                    questionBlock.appendChild(loText);

                    const questionText = document.createElement('p');
                    questionText.classList.add('question-text');
                    questionText.innerHTML = `${index + 1}. ${qData.question}`;
                    questionBlock.appendChild(questionText);

                    const optionsDiv = document.createElement('div');
                    optionsDiv.classList.add('options');

                    for (const optionKey in qData.options) {
                        const optionId = `q${index}_${optionKey}`;
                        const label = document.createElement('label');
                        label.htmlFor = optionId;
                        const radioInput = document.createElement('input');
                        radioInput.type = 'radio';
                        radioInput.name = `q${index}`;
                        radioInput.value = optionKey;
                        radioInput.id = optionId;
                        const labelText = document.createElement('span');
                        labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                        label.appendChild(radioInput);
                        label.appendChild(labelText);
                        optionsDiv.appendChild(label);
                    }
                    questionBlock.appendChild(optionsDiv);

                    const buttonContainer = document.createElement('div');
                    buttonContainer.classList.add('button-container');

                    const checkButton = document.createElement('button');
                    checkButton.textContent = 'Check Answer';
                    checkButton.classList.add('check-button');
                    checkButton.onclick = () => checkAnswer(index);
                    buttonContainer.appendChild(checkButton);
                    
                    questionBlock.appendChild(buttonContainer);

                    const feedbackDiv = document.createElement('div');
                    feedbackDiv.classList.add('feedback');
                    questionBlock.appendChild(feedbackDiv);

                    quizContainer.appendChild(questionBlock);
                });
            }

            // Make checkAnswer globally accessible
            window.checkAnswer = function(questionIndex) {
                const questionBlockElement = document.getElementById(`q${questionIndex}`);
                const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

                if (!selectedRadioButton) {
                    alert("Please select an answer first.");
                    return;
                }

                const selectedOptionKey = selectedRadioButton.value;
                const qData = quizData[questionIndex];
                const feedbackDiv = questionBlockElement.querySelector('.feedback');
                const correct = selectedOptionKey === qData.correctAnswer;

                let feedbackHTML = '';

                if (correct) {
                    feedbackHTML = `<span class="feedback-status">Correct!</span>`;
                    feedbackDiv.className = 'feedback correct';
                } else {
                     feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
                    feedbackDiv.className = 'feedback incorrect';
                }

                feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
                feedbackHTML += `<div class="feedback-source">${qData.source}</div>`;
                feedbackDiv.innerHTML = feedbackHTML;
            }

            // --- Initial Load ---
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            applyTheme(savedTheme);
            loadQuiz();
        });

    </script>
